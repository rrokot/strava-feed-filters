name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Check the userscript, regenerate the derived files and lint the extension
        run: python scripts/check.py

      # The userscript is the source of truth; a diff here means someone edited a
      # generated file or forgot to run scripts/build.py.
      - name: Verify the committed generated files are current
        run: git diff --exit-code

      - uses: actions/upload-artifact@v7
        with:
          name: extension
          path: dist/*.zip
          if-no-files-found: error
