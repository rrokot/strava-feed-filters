name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Check the userscript parses
        run: node --check strava-photo-filter-toggle.user.js

      # Regenerates content.js, the .meta.js stub and the manifest version from the
      # userscript, and builds the store zip.
      - name: Package the extension
        run: python package-extension.py

      # The generated files are committed (Tampermonkey and the stores read them from the
      # repository), so they go stale if someone edits the userscript without repackaging.
      - name: Fail if generated files are out of date
        run: git diff --exit-code

      # Mozilla's addons-linter, the same one AMO review runs: manifest schema, missing
      # icon files, remote code, deprecated APIs. Run via npx so the repository keeps no
      # Node dependencies. Warnings do not fail the build; errors do.
      - name: Lint the extension for the add-on stores
        run: npx --yes web-ext@10.8.0 lint --source-dir=extension

      - uses: actions/upload-artifact@v7
        with:
          name: extension
          path: dist/*.zip
          if-no-files-found: error
