name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Check the userscript parses
        run: node --check strava-photo-filter-toggle.user.js

      - name: Regenerate files from the userscript and package the extension
        run: python package-extension.py

      - name: Verify the committed generated files are current
        run: git diff --exit-code

      - name: Lint the extension for the add-on stores
        run: npx --yes web-ext@10.8.0 lint --source-dir=extension

      - uses: actions/upload-artifact@v7
        with:
          name: extension
          path: dist/*.zip
          if-no-files-found: error
